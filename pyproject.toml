[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-commerce-lab"
version = "0.1.0"
description = "Merchant-side decision system for agent-mediated demand"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
providers = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
# Explicit. Without this, flat-layout auto-discovery sees acop/, fixtures/,
# artifacts/, scripts/, tests/ as competing top-level packages and refuses.
packages = ["acop", "acop.adapters"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
